<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1 class="logo">My Project</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Features</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Sentiment Analysis</h2>
            <p>Enter text below to analyze its sentiment.</p>
        </section>

        <section class="analysis-section">
            <div class="card">
                <form method="POST" action="/">
                    <textarea name="text_input" placeholder="Type your text here..." rows="5" required></textarea>
                    <button type="submit" class="btn-primary">Analyze Sentiment</button>
                </form>
                
                {% if sentiment %}
                <div class="result">
                    <h3>Result: <span class="sentiment-score">{{ sentiment }}</span></h3>
                </div>
                {% endif %}
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2024 Project Name. All rights reserved.</p>
    </footer>
</body>
</html>
